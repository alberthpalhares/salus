# _index.yaml — Fonte estruturada do Salus
#
# ATENÇÃO IA: este arquivo é o PRIMEIRO que você deve ler para qualquer pergunta
# sobre o panorama da família (raio-x, cruzar, preparar-consulta, revisão, agenda).
# Ele concentra os campos "quentes" (datas, alergias, status, medicamentos, vacinas,
# antiparasitários, exames pendentes, marcadores-chave) para que você não precise abrir
# todos os arquivos de perfil a cada pergunta.
#
# PRECEDÊNCIA: este índice manda em datas, status e campos estruturados; os arquivos de
# perfil (Ficha.md, Historico.md, Exames.md, Genetica.md, Documentos/) mandam na narrativa
# e no detalhe. Se um dado aqui e no perfil divergirem, trate como falha de sincronia:
# aponte ao usuário e corrija os dois (com confirmação). A mesma regra está em
# Familia/META.md e em Frameworks/PROTOCOLO_CLINICO.md.
#
# REGRA DE SINCRONIA: toda skill que grava um dado novo (registrar, salus-organiza,
# cruzar, preparar-consulta, salus-revisao) DEVE atualizar este arquivo (inclusive
# `atualizado_em`) no mesmo passo em que grava a prosa correspondente, e regenerar as
# views derivadas afetadas (Agenda.md, Medicamentos_Ativos.md, Linha_do_Tempo_Geral.md).
#
# DATAS: sempre AAAA-MM-DD. Campo sem informação: "" (string vazia) ou null, conforme o comentário.

schema_versao: 1               # versão do formato deste arquivo (a skill salus-revisao migra formatos antigos)
familia: "[Sobrenome/identificação]"
atualizado_em: "[AAAA-MM-DD]"

membros:
  # Repita este bloco para cada membro (pessoa ou animal).
  - id: "[identificador-curto, ex: alberth]"
    nome: "[Nome]"
    tipo: "pessoa"              # pessoa | cao | gato | outro
    perfil: "Perfis/[Nome]/"
    nascimento: "[AAAA-MM-DD]"  # ou "" se não informado
    vinculo: "biologico"        # biologico | adotivo | enteado | nao_aplicavel
                                 # biologico é o default para humanos; nao_aplicavel para pets.
                                 # Este campo é usado pela skill `cruzar` para decidir
                                 # se cruza genéticos/hereditários. NÃO exponha este
                                 # campo na Ficha.md do membro (fica só aqui, por privacidade).

    alergias: null              # null = ainda não perguntado/informado (a IA deve perguntar);
                                 # [] = confirmado que não há alergia conhecida;
                                 # ex: ["Dipirona", "Mofo", "Proteína de frango"]
    condicoes_ativas: []        # ex: ["Hipertensão", "Hipotireoidismo"]

    medicamentos_em_uso: []
      # - nome: "[Medicamento]"
      #   dose: "[dose e frequência, ex: 50mg 1x/dia]"
      #   desde: "[AAAA-MM-DD]"
      #   prescrito_por: "[profissional ou vazio]"
      #   renova_em: "[AAAA-MM-DD ou vazio — use para uso contínuo com receita]"
      #   termino_em: "[AAAA-MM-DD ou vazio — use para tratamento de ciclo fechado, ex: 5 dias]"

    medicamentos_prescritos: []
      # - nome: "[Medicamento]"
      #   dose: "[dose e frequência]"
      #   data_receita: "[AAAA-MM-DD]"
      #   prescrito_por: "[profissional ou vazio]"
      #   validade_receita: "[AAAA-MM-DD ou vazio — para alertar receita não comprada que vence]"

    vacinas: []
      # - nome: "[Vacina]"
      #   aplicada_em: "[AAAA-MM-DD]"
      #   proxima_em: "[AAAA-MM-DD]"

    antiparasitarios: []
      # Aplicável principalmente a pets (cao | gato), onde vermífugo e antipulgas/carrapatos
      # têm ciclos frequentes (30 a 90 dias) e precisam constar na Agenda.md e no Raio-X.
      # - nome: "[ex: Simparic / Bravecto / Milbemax]"
      #   tipo: "[antipulgas | vermifugo]"
      #   aplicado_em: "[AAAA-MM-DD]"
      #   proximo_em: "[AAAA-MM-DD]"

    exames_pendentes: []
      # Requisições/pedidos de exame ainda não realizados (arquivados em Documentos/Requisicoes/).
      # Saem daqui quando o resultado chega (salus-organiza) ou quando o usuário diz que fez.
      # - tipo: "[ex: Hemograma completo / Ultrassom abdominal]"
      #   solicitado_em: "[AAAA-MM-DD]"
      #   solicitado_por: "[profissional ou vazio]"
      #   realizar_ate: "[AAAA-MM-DD ou vazio]"

    proximos_checkups: []
      # - tipo: "[ex: Retorno cardiologista]"
      #   data: "[AAAA-MM-DD]"

    ultimo_exame_em: "[AAAA-MM-DD ou vazio]"

    marcadores_chave: []
      # Só os marcadores mais relevantes para acompanhamento contínuo (ex: colesterol,
      # glicemia, TSH, creatinina, peso) — não é para duplicar o Exames.md inteiro, só o essencial
      # para responder "como está o [marcador] do [nome]?" sem abrir o arquivo completo.
      # - marcador: "[ex: Colesterol total]"
      #   valor: "[número]"
      #   unidade: "[ex: mg/dL]"
      #   data: "[AAAA-MM-DD]"
      #   flag: "normal"        # normal | alto | baixo — SEMPRE copiado do que o laudo sinalizou.
                                 # Nunca invente ou memorize faixa de referência aqui (ver Protocolo Clínico).
