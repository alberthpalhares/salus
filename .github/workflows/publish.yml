name: Publish to NPM

# Só a tag vX.Y.Z publica. Push na main e PRs rodam apenas a CI (ci.yml).
# A tag roda primeiro a CI completa (ci.yml, via workflow_call: Linux e Windows,
# Node 22 e 24); o job `publish` só começa se ela passar inteira.
#
# Publicação por trusted publishing (OIDC): não há token do npm neste repositório.
# O pacote `salus-ai` precisa ter este repositório e este arquivo (`publish.yml`)
# cadastrados como Trusted Publisher no npmjs.com; o npm CLI precisa ser >= 11.5.1
# (Node 24 já traz). A proveniência (provenance) é gerada automaticamente.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

# Evita duas publicações concorrentes
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Conferir npm >= 11.5.1 (exigido pelo trusted publishing)
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSAO="$(npm --version)"
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit((a>11||(a===11&&(b>5||(b===5&&c>=1))))?0:1)" "$NPM_VERSAO"; then
            echo "::error::npm $NPM_VERSAO é anterior a 11.5.1; trusted publishing exige 11.5.1 ou mais recente"
            exit 1
          fi

      - name: Conferir tag × versão
        shell: bash
        run: |
          set -euo pipefail
          VERSAO="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSAO" ]; then
            echo "::error::Tag $GITHUB_REF_NAME não corresponde à versão $VERSAO do package.json"
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Publish to NPM (trusted publishing, sem token)
        run: npm publish --provenance --access public
