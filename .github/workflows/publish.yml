name: Publish to NPM

# Só a tag vX.Y.Z publica. Push na main e PRs rodam apenas a CI (ci.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

# Evita duas publicações concorrentes
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Instalar dependências
        run: npm ci

      # Porta antes de publicar: a mesma da CI. Qualquer falha impede o publish.
      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Consistência das docs
        run: bash scripts/check-docs.sh

      - name: Conferir tag × versão
        shell: bash
        run: |
          set -euo pipefail
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || {
            echo "A tag $GITHUB_REF_NAME não bate com a versão do package.json (v$(node -p "require('./package.json').version")). Nada foi publicado."
            exit 1
          }

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
