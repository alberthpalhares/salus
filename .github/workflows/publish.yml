name: Publish to NPM

# Só a tag vX.Y.Z publica. Push na main e PRs rodam apenas a CI (ci.yml).
# A tag roda primeiro a CI completa (ci.yml, via workflow_call: Linux e Windows,
# Node 22 e 24); o job `publish` só começa se ela passar inteira.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

# Evita duas publicações concorrentes
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Conferir tag × versão
        shell: bash
        run: |
          set -euo pipefail
          VERSAO="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSAO" ]; then
            echo "::error::Tag $GITHUB_REF_NAME não corresponde à versão $VERSAO do package.json"
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
