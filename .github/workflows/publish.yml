name: Publish to NPM

on:
  push:
    branches:
      - main

# Evita duas publicações concorrentes da mesma versão
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Porta mínima antes de publicar: docs consistentes, e o CLI precisa carregar,
      # inicializar uma pasta, passar no doctor e atualizar a si mesmo.
      # Qualquer falha impede o publish.
      - name: Smoke test do CLI e consistência das docs
        run: |
          set -euo pipefail
          bash scripts/check-docs.sh
          node --check bin/cli.js
          node bin/cli.js --version
          SMOKE="$RUNNER_TEMP/salus-smoke"
          node bin/cli.js init "$SMOKE"
          test -f "$SMOKE/AGENTS.md"
          test -f "$SMOKE/Frameworks/PROTOCOLO_CLINICO.md"
          test -d "$SMOKE/.agents/skills/raio-x"
          node bin/cli.js doctor "$SMOKE"
          node bin/cli.js update "$SMOKE"
          npm pack --dry-run

      - name: Publish to NPM if version updated
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
            echo "A versão ${PACKAGE_VERSION} de ${PACKAGE_NAME} já está publicada no NPM. Pulando publicação."
          else
            echo "Publicando a versão ${PACKAGE_VERSION} de ${PACKAGE_NAME} no NPM..."
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
